name: Master PR checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check-ignored-files:
    name: check-ignored-files
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR merge result
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked files excluded by master's .gitignore
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          base_ignore="${RUNNER_TEMP}/master.gitignore"
          git show "${BASE_SHA}:.gitignore" > "${base_ignore}"

          ignored_files="$(git ls-files --cached --ignored --exclude-from="${base_ignore}")"
          if [[ -n "${ignored_files}" ]]; then
            printf 'Tracked files excluded by master .gitignore:\n%s\n' "${ignored_files}"
            exit 1
          fi

          echo "No tracked files are excluded by master .gitignore."

  # 1F 圖資草稿的資料一致性檢查；不取代現勘、實測與跨樓層連接的人工確認。
  # 不執行 validate-floor1-svg.py --strict：實際尺寸與正式世界座標尚未完成。
  floor1-draft-checks:
    name: floor1-draft-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR merge result
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # 環境備妥後，即使前一項檢查失敗仍執行其餘項目，一次看到所有錯誤。
      # 任一步驟失敗，整個 job 就會顯示失敗。
      - name: '1/4 Draft outputs are in sync (build-floor1-graph --check)'
        run: node tools/build-floor1-graph.mjs --check

      - name: '2/4 SVG and draft data consistency (validate-floor1-svg)'
        if: ${{ !cancelled() && steps.setup-python.outcome == 'success' }}
        run: python3 tools/validate-floor1-svg.py

      - name: '3/4 Python regression tests (unittest)'
        if: ${{ !cancelled() && steps.setup-python.outcome == 'success' }}
        run: python3 -m unittest discover -s tools -p "test_floor1*.py"

      - name: '4/4 Graph and draft route tests (node --test)'
        if: ${{ !cancelled() && steps.setup-python.outcome == 'success' }}
        run: node --test tools/build-floor1-graph.test.mjs examples/floor1-draft-route.test.mjs

  # 比對實際解析版本與 Technology_Stack.md、libs.versions.toml。
  # dependencyInsight 只供查看來源；是否相符由 check-android-versions.py 判定。
  android-version-check:
    name: android-version-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR merge result
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Test the version checker (matching passes, wrong versions fail)
        run: python3 -m unittest discover -s tools -p "test_android_versions.py" -v

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Collect resolved versions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version | tee "${RUNNER_TEMP}/gradle-version.txt"
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --console=plain | tee "${RUNNER_TEMP}/runtime.txt"
          ./gradlew buildEnvironment --console=plain | tee "${RUNNER_TEMP}/buildscript.txt"

      - name: Show how WebKit was resolved (dependencyInsight)
        run: ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency androidx.webkit --console=plain

      - name: Compare resolved versions with the project baseline
        run: >-
          python3 tools/check-android-versions.py
          --gradle-version "${RUNNER_TEMP}/gradle-version.txt"
          --runtime "${RUNNER_TEMP}/runtime.txt"
          --buildscript "${RUNNER_TEMP}/buildscript.txt"
