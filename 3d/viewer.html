<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <title>樓層地圖｜Three.js</title>
  <style>:root{font-family:Inter,"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;color:#273631;background:#f8f9f5;font-size:16px;--line:#dce1d9;--muted:#5e6d62;--green:#235847}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column}
button,select{font:inherit;color:inherit}
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;background:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #948449;outline-offset:3px}
button:disabled{opacity:.55;cursor:wait}
i,.logo{display:inline-flex;align-items:center;justify-content:center;font-style:normal}
i svg{width:18px;height:18px}
header{height:68px;background:#fff;border-bottom:1px solid var(--line);padding:0 25px;display:flex;align-items:center;justify-content:space-between;gap:14px;z-index:2}
.identity,.header-actions{display:flex;align-items:center;gap:14px}
.identity strong{font-size:1.2rem;letter-spacing:.08em;white-space:nowrap}
.logo{width:36px;height:36px;border-radius:9px;background:#275b49;color:#f2f7ec}
.logo svg{width:26px;height:26px}
.separator{border-left:1px solid var(--line);height:18px}
.app-name{color:var(--muted);font-size:.9rem;letter-spacing:.04em}
.header-actions{gap:8px}
.primary,.secondary{font-size:.88rem;font-weight:600;border-radius:7px;min-height:37px;padding:0 13px}
.primary{background:#285846;color:white}
.primary:hover{background:#194333}
.secondary{border:1px solid var(--line);background:#fff}
.secondary:hover,.zoom-controls button:hover,.dialog-bar button:hover{background:#edf1eb}
main{display:grid;grid-template-columns:minmax(0,1fr) clamp(255px,21vw,310px);flex:1;min-height:0}
#stage{position:relative;isolation:isolate;overflow:hidden;height:calc(100dvh - 101px);min-height:420px;background-color:#eff1eb;background-image:radial-gradient(#cad1c5 .75px,transparent .85px);background-size:17px 17px}
#canvas-wrap,#canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#canvas-wrap canvas{touch-action:none;cursor:grab}
#canvas-wrap canvas:active{cursor:grabbing}
.view-heading{position:absolute;top:25px;left:26px;display:flex;align-items:center;gap:12px;pointer-events:none}
.floor-tag{font:600 1.05rem/1.2 Consolas,monospace;letter-spacing:-.05em;color:#eff8ec;background:#345c48;border-radius:6px;padding:7px 8px}
h1{font-size:clamp(1.1rem,1.8vw,1.5rem);font-weight:650;letter-spacing:.055em;margin:0}
.mode,.zoom-controls{display:flex;align-items:center;background:#fffffff5;border:1px solid #d5dbd2;border-radius:9px;box-shadow:0 2px 7px #2633230b}
.mode{position:absolute;top:25px;right:23px;padding:3px}
.mode button{font-size:.88rem;padding:6px 11px;border-radius:6px;color:#5b665c}
.mode button[aria-pressed=true]{background:#e0e9de;color:#234c39;font-weight:650}
.mode i svg{width:16px;height:16px}
.zoom-controls{position:absolute;right:23px;bottom:20px;padding:3px 4px;gap:2px}
.zoom-controls button,.dialog-bar button{width:34px;height:33px;border-radius:6px}
#zoom{font:500 .82rem Consolas,monospace;text-align:center;min-width:43px}
.zoom-controls .separator{margin:0 3px}
#axes{position:absolute;bottom:10px;left:18px;width:70px;height:66px;pointer-events:none}
#selection-tag{position:absolute;top:0;left:0;pointer-events:none;background:#225943;color:white;font:600 .81rem/1.2 Consolas,monospace;padding:5px 8px;border-radius:5px;box-shadow:0 2px 8px #26332326;white-space:nowrap}
#message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:12px 16px;border:1px solid var(--line);border-radius:7px;font-size:.9rem}
[hidden]{display:none!important}
aside{background:#fcfdf9;border-left:1px solid var(--line);height:calc(100dvh - 101px);min-height:420px;overflow-y:auto}
.panel-section{padding:22px 21px;border-bottom:1px solid var(--line)}
.panel-section:last-child{border:0}
h2{display:flex;align-items:center;gap:9px;font-size:1rem;letter-spacing:.035em;margin:0 0 17px;font-weight:680}
h2 i{color:#5d7566}
.layer-row{display:grid;grid-template-columns:13px 1fr auto 28px;align-items:center;gap:10px;min-height:34px;cursor:pointer;font-size:.9rem}
.swatch{width:11px;height:11px;background:var(--swatch);border:1px solid #253b2e2a;border-radius:3px}
.count{font:400 .8rem Consolas,monospace;color:#68776c}
.switch{appearance:none;margin:0;width:27px;height:16px;border:1px solid #b6c0b4;background:#d8dfd5;border-radius:20px;cursor:pointer;position:relative}
.switch:after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff}
.switch:checked{background:#3b6953;border-color:#3b6953}
.switch:checked:after{left:13px}
.select-wrap{display:flex;align-items:center;position:relative}
select{cursor:pointer;width:100%;appearance:none;background:#fff;border:1px solid #cbd3c8;border-radius:6px;padding:9px 29px 9px 10px;font-size:.89rem}
.select-wrap i{position:absolute;right:9px;pointer-events:none}
#room-info,.info p{font-size:.8rem;color:var(--muted);line-height:1.7;margin:10px 0 0}
.info dl{display:grid;grid-template-columns:1fr auto;gap:9px 4px;font-size:.85rem;margin:0}
dt{color:var(--muted)}
dd{margin:0;text-align:right}
.info p{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
footer{height:33px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#fbfcf9;color:#5b685c;font-size:.77rem}
footer span{display:inline-flex;align-items:center;gap:7px}
footer i svg{width:14px;height:14px}
footer b{font-weight:400;color:#a0aca0}
.touch-hint{display:none}
.minimal body{min-height:0}
.minimal main{display:block}
.minimal header,.minimal aside,.minimal footer,.minimal #stage > :not(#canvas-wrap):not(#axes):not(#message){display:none}
.minimal #stage{height:100dvh;min-height:0;width:100%;background-image:none}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:#fff;color:inherit;width:min(1100px,94vw);max-height:92dvh;overflow:auto;box-shadow:0 20px 90px #27332344}
dialog::backdrop{background:#182b2573}
.dialog-bar{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line)}
.dialog-bar small{font:normal .8rem Consolas,monospace;color:var(--muted);margin-left:8px}
dialog img{display:block;width:100%;height:min(76dvh,780px);object-fit:contain}
@media(pointer:coarse){.desktop-hint{display:none}.touch-hint{display:inline}}
@media(max-width:760px){
 header{height:59px;padding:0 12px}.identity,.header-actions{gap:7px}.identity strong{font-size:1.05rem}.logo{width:31px;height:31px}
 .app-name,.identity .separator{display:none}.primary,.secondary{padding:0 8px;font-size:.8rem}.header-actions i svg{width:15px}
 main{display:flex;flex-direction:column}#stage{height:60dvh;min-height:340px}.view-heading{top:14px;left:13px;gap:7px}
 .floor-tag{font-size:.83rem;padding:5px 6px}.mode{top:12px;right:12px}.mode button{padding:5px 7px;font-size:.8rem}
 .zoom-controls{bottom:11px;right:12px}#axes{left:7px;bottom:2px;width:56px;height:53px}
 aside{height:auto;min-height:0;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
 .panel-section{padding:17px}.layer-row{min-height:35px}footer{padding:0 10px}
}
</style>
</head>
<body>
  <header>
    <div class="identity"><span class="logo" data-icon="building"></span><strong>工程五館</strong><span class="separator"></span><span class="app-name">建築模型檢視器</span></div>
    <div class="header-actions">
      <label id="file-picker" hidden>開啟 SVG <input id="local-svg" type="file" accept=".svg,image/svg+xml"></label>
      <button id="source" class="secondary" disabled><i data-icon="plan"></i>原始圖面</button>
      <button id="download" class="primary" disabled><i data-icon="download"></i><span>匯出 GLB</span></button>
    </div>
  </header>
  <main>
    <section id="stage" aria-label="互動式三維模型">
      <div id="canvas-wrap"></div>
      <div class="view-heading"><div class="floor-tag">1F</div><h1>一樓空間模型</h1></div>
      <div class="mode" aria-label="檢視角度">
        <button id="iso" aria-pressed="true"><i data-icon="cube"></i>立體</button>
        <button id="top" aria-pressed="false"><i data-icon="top"></i>俯視</button>
      </div>
      <div id="selection-tag" hidden></div>
      <div id="message" role="status">載入模型中…</div>
      <div id="axes" aria-hidden="true"><svg viewBox="0 0 78 72"></svg></div>
      <div class="zoom-controls">
        <button id="minus" title="縮小" aria-label="縮小"><i data-icon="minus"></i></button>
        <span id="zoom">100%</span>
        <button id="plus" title="放大" aria-label="放大"><i data-icon="plus"></i></button>
        <span class="separator"></span><button id="fit" title="顯示全層" aria-label="顯示全層"><i data-icon="fit"></i></button>
      </div>
    </section>
    <aside aria-label="模型設定">
      <section class="panel-section">
        <h2><i data-icon="layers"></i>模型圖層</h2>
        <div id="layers"></div>
      </section>
      <section class="panel-section">
        <h2><i data-icon="locate"></i>房間定位</h2>
        <label class="select-wrap"><select id="rooms" aria-label="選擇房間"><option value="">選擇房間</option></select><i data-icon="chevron"></i></label>
        <div id="room-info">可直接點選模型內的房間。</div>
      </section>
      <section class="info panel-section">
        <h2><i data-icon="info"></i>模型資料</h2>
        <dl><dt>來源</dt><dd id="source-name"></dd><dt>座標</dt><dd>SVG 圖面單位</dd><dt>牆高／門高</dt><dd id="heights"></dd></dl>
        <p>平面依原圖比例建模。圖面未實測，垂直尺寸為示意值。</p>
      </section>
    </aside>
  </main>
  <footer><span><i data-icon="mouse"></i><span class="desktop-hint">拖曳旋轉 · 右鍵平移 · 滾輪縮放</span><span class="touch-hint">單指旋轉 · 雙指平移與縮放</span></span><span>Three.js <b>／</b> WebGL</span></footer>
  <dialog id="reference"><div class="dialog-bar"><strong>原始圖面 <small>floor-1.svg</small></strong><button id="close-source" title="關閉" aria-label="關閉原始圖面"><i data-icon="close"></i></button></div><img id="source-image" alt="工程五館一樓原始 SVG 平面圖"></dialog>
